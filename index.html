<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="src/assets/images/icone-sailingloc.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SailingLoc - Location de bateaux</title>
    
    <!-- Google reCAPTCHA -->
    <script 
      src="https://www.google.com/recaptcha/api.js?onload=onRecaptchaLoad&render=explicit"
      async 
      defer>
    </script>
    <script>
      // Fonction de rappel appelée quand reCAPTCHA est prêt
      window.onRecaptchaLoad = function() {
        console.log('reCAPTCHA prêt');
        window.recaptchaLoaded = true;
        // Déclenche un événement personnalisé pour informer React
        document.dispatchEvent(new Event('recaptchaReady'));
      };
    </script>
    
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
