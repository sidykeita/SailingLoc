<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="src/assets/images/icone-sailingloc.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SailingLoc - Location de bateaux</title>
    
    <!-- Google reCAPTCHA -->
    <script>
      // Global callback for reCAPTCHA
      window.onRecaptchaLoad = function() {
        console.log('reCAPTCHA prêt');
        window.recaptchaLoaded = true;
        // Trigger custom event to notify React components
        document.dispatchEvent(new Event('recaptchaReady'));
      };

      // Load reCAPTCHA script
      (function() {
        const script = document.createElement('script');
        script.src = `https://www.google.com/recaptcha/api.js?onload=onRecaptchaLoad&render=explicit`;
        script.async = true;
        script.defer = true;
        script.onerror = function() {
          console.error('Failed to load reCAPTCHA script');
          document.dispatchEvent(new Event('recaptchaError'));
        };
        document.head.appendChild(script);
      })();
    </script>
    
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
