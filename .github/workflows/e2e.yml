name: E2E Tests (Playwright)

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Deployed base URL to test (e.g. https://sailingloc.vercel.app)'
        required: true
        default: 'https://dsp-dev023-g5.vercel.app'
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # Optionnel: attendre que le déploiement soit prêt si vous avez un step de déploiement plus haut.
      # - name: Wait for deployment
      #   run: npx wait-on ${{ inputs.base_url || env.E2E_BASE_URL }}

      - name: Run Playwright tests
        env:
          E2E_BASE_URL: ${{ inputs.base_url }}
          E2E_OWNER_EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
          E2E_OWNER_PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD }}
          E2E_TENANT_EMAIL: ${{ secrets.E2E_TENANT_EMAIL }}
          E2E_TENANT_PASSWORD: ${{ secrets.E2E_TENANT_PASSWORD }}
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
